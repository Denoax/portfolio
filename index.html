<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#020205" />
    <meta
      name="description"
      content="Mani Marami Milani is a Computer Science and Mathematics student working across software, data, automation, and scientific infrastructure."
    />
    <script>
      // First paint uses the same safe default and legacy migration as settings.
      let theme = 'light'
      try {
        const saved = JSON.parse(
          localStorage.getItem('portfolio:experience-settings:v1') || 'null',
        )
        if (saved?.version === 1 && ['light', 'dark'].includes(saved.theme))
          theme = saved.theme
      } catch {
        /* Storage is optional; the user's new default is light. */
      }
      document.documentElement.dataset.colorTheme = theme
      document.documentElement.style.colorScheme = theme
      document.documentElement.style.backgroundColor =
        theme === 'light' ? '#f3f5f7' : '#080808'
      document.querySelector('meta[name="theme-color"]').content =
        theme === 'light' ? '#f3f5f7' : '#080808'
    </script>
    <title>Mani Marami Milani — Computer Science Portfolio</title>
    <link
      rel="icon"
      type="image/png"
      href="/assets/profile/profile-v12-32.png"
    />
    <link rel="apple-touch-icon" href="/assets/profile/profile-v12-192.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

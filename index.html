<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#020205" />
    <meta
      name="description"
      content="Mani Marami Milani is a Computer Science and Mathematics student working across software, data, automation, and scientific infrastructure."
    />
    <script>
      // First paint uses the same safe default and legacy migration as settings.
      let theme = 'light'
      try {
        const saved = JSON.parse(
          localStorage.getItem('portfolio:experience-settings:v1') || 'null',
        )
        if ((saved?.version === 1 || saved?.version === 2) && ['light', 'dark'].includes(saved.theme))
          theme = saved.theme
      } catch {
        /* Storage is optional; the user's new default is light. */
      }
      document.documentElement.dataset.colorTheme = theme
      document.documentElement.style.colorScheme = theme
      document.documentElement.style.backgroundColor =
        theme === 'light' ? '#f3f5f7' : '#080808'
      document.querySelector('meta[name="theme-color"]').content =
        theme === 'light' ? '#f3f5f7' : '#080808'
    </script>
    <style>/* PORTFOLIO_BOOT_CSS */</style>
    <title>Mani Marami Milani — Computer Science Portfolio</title>
    <link
      rel="icon"
      type="image/png"
      href="/assets/profile/profile-v12-32.png"
    />
    <link rel="apple-touch-icon" href="/assets/profile/profile-v12-192.png" />
  </head>
  <body>
    <!-- PORTFOLIO_BOOT_SHELL -->
    <div id="root" inert aria-busy="true"></div>
    <script>
      // A pre-module recovery boundary; ownership transfers once bootstrap runs.
      (() => {
        let connected = false
        const recover = () => {
          if (connected) return
          const shell = document.getElementById('portfolio-boot')
          if (!shell) return
          shell.dataset.phase = 'FALLBACK'
          document.getElementById('portfolio-boot-status').textContent =
            'The interactive view could not start. Reload the page or explore the projects on GitHub.'
          document.querySelector('[data-boot-retry]').href = location.href
        }
        const deadline = setTimeout(recover, 12000)
        const failed = event => {
          if (event.target?.id === 'portfolio-bootstrap') recover()
        }
        window.addEventListener('error', failed, true)
        window.addEventListener('portfolio:boot-connected', () => {
          connected = true
          clearTimeout(deadline)
          window.removeEventListener('error', failed, true)
        }, { once: true })
      })()
    </script>
    <script id="portfolio-bootstrap" type="module" src="/src/bootstrap.ts"></script>
  </body>
</html>
